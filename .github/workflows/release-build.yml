name: Release Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Release tag, for example v2.0.0
        required: true
        type: string

permissions:
  contents: write
  pull-requests: read

jobs:
  prepare-release:
    name: Prepare release
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF_NAME}"
          fi
          if [[ ! "$version" =~ ^v[0-9]+(\.[0-9]+)*$ ]]; then
            echo "Invalid release version: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json
          import os
          import pathlib
          import urllib.error
          import urllib.request

          repo = os.environ["GH_REPO"]
          token = os.environ["GH_TOKEN"]
          version = os.environ["VERSION"]
          notes_path = pathlib.Path("release-notes") / f"{version}.md"
          if not notes_path.exists():
              notes_path = pathlib.Path("RELEASE_NOTES.md")
          body = notes_path.read_text(encoding="utf-8") if notes_path.exists() else f"Release {version}"

          def request(method, url, payload=None):
              data = None
              if payload is not None:
                  data = json.dumps(payload).encode("utf-8")
              headers = {
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {token}",
                  "Content-Type": "application/json",
                  "User-Agent": "fwlog-release-build",
                  "X-GitHub-Api-Version": "2022-11-28",
              }
              req = urllib.request.Request(url, data=data, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req) as response:
                      response_body = response.read()
                      return json.loads(response_body.decode("utf-8")) if response_body else None
              except urllib.error.HTTPError as error:
                  if error.code == 404:
                      return None
                  raise

          release = request("GET", f"https://api.github.com/repos/{repo}/releases/tags/{version}")
          payload = {
              "tag_name": version,
              "target_commitish": os.environ["GITHUB_SHA"],
              "name": version,
              "body": body,
              "draft": False,
              "prerelease": False,
          }
          if release is None:
              request("POST", f"https://api.github.com/repos/{repo}/releases", payload)
              print(f"Created release {version}")
          else:
              request("PATCH", release["url"], payload)
              print(f"Updated release {version}")
          PY

  build:
    name: Build server packages
    runs-on: ubuntu-24.04
    needs: prepare-release
    env:
      TZ: Asia/Shanghai
      CLICKHOUSE_VERSION: 25.8.27.1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Build frontend assets
        working-directory: web
        run: npm run build

      - name: Run frontend tests
        working-directory: web
        run: npm test

      - name: Install package build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cpio rpm

      - name: Run Go tests
        run: go test -race -count=1 ./...

      - name: Build Linux binary and server packages
        shell: bash
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          mkdir -p release
          asset="fwlog_${GOOS}_${GOARCH}"
          version="${{ needs.prepare-release.outputs.version }}"
          pkg_version="${version#v}"
          go build -trimpath -ldflags "-s -w -X fwlog/internal/server.appVersion=$version" -o "release/$asset" ./cmd/fwlog
          PACKAGING_MODE=full bash packaging/build-server-packages.sh --version "$version" --binary "release/$asset" --output release
          PACKAGING_MODE=upgrade bash packaging/build-server-packages.sh --version "$version" --binary "release/$asset" --output release
          cp "release/fwlog-upgrade-v${pkg_version}.x86_64.rpm" "release/fwlog_kylin-server_amd64.rpm"
          cp "release/fwlog-upgrade_${pkg_version}_amd64.deb" "release/fwlog_debian-server_amd64.deb"
          (cd release && sha256sum \
            fwlog_linux_amd64 \
            fwlog_kylin-server_amd64.rpm \
            fwlog_debian-server_amd64.deb \
            "fwlog-full-v${pkg_version}.x86_64.rpm" \
            "fwlog-full_${pkg_version}_amd64.deb" \
            "fwlog-full-v${pkg_version}-amd64.tar.gz" \
            "fwlog-upgrade-v${pkg_version}.x86_64.rpm" \
            "fwlog-upgrade_${pkg_version}_amd64.deb" \
            > checksums.txt)
          VERSION="$version" PKG_VERSION="$pkg_version" CLICKHOUSE_VERSION="$CLICKHOUSE_VERSION" python3 <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path("release")
          pkg = os.environ["PKG_VERSION"]
          names = {
              "rpm": f"fwlog-upgrade-v{pkg}.x86_64.rpm",
              "deb": f"fwlog-upgrade_{pkg}_amd64.deb",
              "full": f"fwlog-full-v{pkg}-amd64.tar.gz",
          }
          assets = {}
          for kind, name in names.items():
              data = (root / name).read_bytes()
              assets[kind] = {"name": name, "sha256": hashlib.sha256(data).hexdigest()}
          manifest = {
              "app_version": os.environ["VERSION"],
              "runtime_version": f"clickhouse-{os.environ['CLICKHOUSE_VERSION']}",
              "arch": "amd64",
              "assets": assets,
          }
          (root / "latest.json").write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.prepare-release.outputs.version }}"
          gh release view "$version" --repo "$GH_REPO" >/dev/null
          pkg_version="${version#v}"
          allowed_assets="$(printf '%s\n' \
            "fwlog_linux_amd64" \
            "fwlog_kylin-server_amd64.rpm" \
            "fwlog_debian-server_amd64.deb" \
            "fwlog-full-v${pkg_version}.x86_64.rpm" \
            "fwlog-full_${pkg_version}_amd64.deb" \
            "fwlog-full-v${pkg_version}-amd64.tar.gz" \
            "fwlog-upgrade-v${pkg_version}.x86_64.rpm" \
            "fwlog-upgrade_${pkg_version}_amd64.deb" \
            "checksums.txt" \
            "latest.json")"
          while IFS= read -r asset_name; do
            if [[ -n "$asset_name" ]] && ! grep -Fxq "$asset_name" <<< "$allowed_assets"; then
              gh release delete-asset "$version" "$asset_name" --repo "$GH_REPO" --yes
            fi
          done < <(gh release view "$version" --repo "$GH_REPO" --json assets --jq '.assets[].name')
          gh release upload "$version" release/* --repo "$GH_REPO" --clobber
