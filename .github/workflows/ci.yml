name: CI

on:
  push:
    branches:
      - main
      - v3-dev
  pull_request:
    branches:
      - main
      - v3-dev
  workflow_dispatch:

jobs:
  test-and-build:
    name: Test and build server packages
    runs-on: ubuntu-24.04
    env:
      TZ: Asia/Shanghai
      CLICKHOUSE_VERSION: 25.8.27.1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Build frontend assets
        working-directory: web
        run: npm run build

      - name: Run frontend tests
        working-directory: web
        run: npm test

      - name: Run Go tests
        run: go test -race -count=1 ./...

      - name: Install package build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm

      - name: Build Linux amd64 binary
        shell: bash
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          mkdir -p dist
          go build -trimpath -ldflags "-s -w" -o dist/nat-query-service_linux_amd64 ./cmd/nat-query-service

      - name: Build full and upgrade server packages
        shell: bash
        run: |
          set -euo pipefail
          PACKAGING_MODE=full bash packaging/build-server-packages.sh --version 0.0.0 --binary dist/nat-query-service_linux_amd64 --output dist
          PACKAGING_MODE=upgrade bash packaging/build-server-packages.sh --version 0.0.0 --binary dist/nat-query-service_linux_amd64 --output dist

      - name: Upload server package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: server-packages-amd64
          path: |
            dist/nat-query-service_linux_amd64
            dist/fwlog-full-v0.0.0.x86_64.rpm
            dist/fwlog-full_0.0.0_amd64.deb
            dist/fwlog-upgrade-v0.0.0.x86_64.rpm
            dist/fwlog-upgrade_0.0.0_amd64.deb
          if-no-files-found: error
