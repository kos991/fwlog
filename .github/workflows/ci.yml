name: CI

on:
  push:
    branches:
      - main
      - v3-dev
  pull_request:
    branches:
      - main
      - v3-dev
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  test-and-build:
    name: Test and build server packages
    runs-on: ubuntu-24.04
    env:
      TZ: Asia/Shanghai
      CLICKHOUSE_VERSION: 25.8.27.1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Build frontend assets
        working-directory: web
        run: npm run build

      - name: Run frontend tests
        working-directory: web
        run: npm test

      - name: Install package build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cpio rpm

      - name: Run Go tests
        run: go test -race -count=1 ./...

      - name: Build Linux amd64 binary
        shell: bash
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          mkdir -p dist
          go build -trimpath -ldflags "-s -w" -o dist/fwlog_linux_amd64 ./cmd/fwlog

      - name: Build full and upgrade server packages
        shell: bash
        run: |
          set -euo pipefail
          PACKAGING_MODE=full bash packaging/build-server-packages.sh --version 0.0.0 --binary dist/fwlog_linux_amd64 --output dist
          PACKAGING_MODE=upgrade bash packaging/build-server-packages.sh --version 0.0.0 --binary dist/fwlog_linux_amd64 --output dist
          PACKAGING_MODE=upgrade bash packaging/build-server-packages.sh --version 0.0.1 --binary dist/fwlog_linux_amd64 --output dist

      - name: Smoke test offline bundle and upgrade package contents
        shell: bash
        run: |
          set -euo pipefail
          bundle="dist/fwlog-full-v0.0.0-amd64.tar.gz"
          bundle_listing="$(tar -tzf "$bundle")"
          grep -Fx 'fwlog-full-v0.0.0-amd64/install.sh' <<<"$bundle_listing"
          temp_dir="$(mktemp -d)"
          tar -xzf "$bundle" -C "$temp_dir"
          (cd "$temp_dir/fwlog-full-v0.0.0-amd64/packages" && sha256sum -c ../checksums.txt)
          bash -n "$temp_dir/fwlog-full-v0.0.0-amd64/install.sh"
          full_deb_contents="$(dpkg-deb --contents dist/fwlog-full_0.0.0_amd64.deb)"
          upgrade_deb_contents="$(dpkg-deb --contents dist/fwlog-upgrade_0.0.0_amd64.deb)"
          full_rpm_contents="$(rpm -qpl dist/fwlog-full-v0.0.0.x86_64.rpm)"
          upgrade_rpm_contents="$(rpm -qpl dist/fwlog-upgrade-v0.0.0.x86_64.rpm)"
          grep -F '/opt/fwlog/RUNTIME_VERSION' <<<"$full_deb_contents"
          grep -F '/opt/fwlog/VERSION' <<<"$upgrade_deb_contents"
          ! grep -F '/opt/fwlog/RUNTIME_VERSION' <<<"$upgrade_deb_contents"
          ! grep -F '/opt/fwlog/clickhouse/' <<<"$upgrade_deb_contents"
          grep -F '/opt/fwlog/RUNTIME_VERSION' <<<"$full_rpm_contents"
          ! grep -F '/opt/fwlog/RUNTIME_VERSION' <<<"$upgrade_rpm_contents"
          ! grep -F '/opt/fwlog/clickhouse/' <<<"$upgrade_rpm_contents"

      - name: Test DEB package upgrade transaction
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -e CLICKHOUSE_VERSION="$CLICKHOUSE_VERSION" -v "$PWD/dist:/packages:ro" ubuntu:24.04 bash -ec '
            export DEBIAN_FRONTEND=noninteractive
            echo "[deb] installing full package"
            apt-get update
            apt-get install -y /packages/fwlog-full_0.0.0_amd64.deb
            echo "[deb] checking full version"
            grep -Fx "VERSION=v0.0.0" /opt/fwlog/VERSION
            grep -Fx "RUNTIME_VERSION=clickhouse-${CLICKHOUSE_VERSION}" /opt/fwlog/RUNTIME_VERSION
            rm -f /opt/fwlog/clickhouse/bin/clickhouse
            echo "[deb] installing upgrade package"
            apt-get install -y /packages/fwlog-upgrade_0.0.1_amd64.deb
            echo "[deb] checking upgraded version"
            grep -Fx "VERSION=v0.0.1" /opt/fwlog/VERSION
            echo "[deb] checking runtime preservation"
            grep -Fx "RUNTIME_VERSION=clickhouse-${CLICKHOUSE_VERSION}" /opt/fwlog/RUNTIME_VERSION
            echo "[deb] checking package status"
            dpkg-query -W -f='${Status}' fwlog-upgrade | grep -Fx "install ok installed"
          '

      - name: Test RPM package upgrade transaction
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -e CLICKHOUSE_VERSION="$CLICKHOUSE_VERSION" -v "$PWD/dist:/packages:ro" rockylinux:9 bash -ec '
            rpm -Uvh /packages/fwlog-full-v0.0.0.x86_64.rpm >/dev/null
            grep -Fx "VERSION=v0.0.0" /opt/fwlog/VERSION
            grep -Fx "RUNTIME_VERSION=clickhouse-${CLICKHOUSE_VERSION}" /opt/fwlog/RUNTIME_VERSION
            rm -f /opt/fwlog/clickhouse/bin/clickhouse
            rpm -Uvh --replacefiles /packages/fwlog-upgrade-v0.0.1.x86_64.rpm >/dev/null
            grep -Fx "VERSION=v0.0.1" /opt/fwlog/VERSION
            grep -Fx "RUNTIME_VERSION=clickhouse-${CLICKHOUSE_VERSION}" /opt/fwlog/RUNTIME_VERSION
            rpm -q fwlog-upgrade
          '

      - name: Upload server package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: server-packages-amd64
          path: |
            dist/fwlog_linux_amd64
            dist/fwlog-full-v0.0.0.x86_64.rpm
            dist/fwlog-full_0.0.0_amd64.deb
            dist/fwlog-full-v0.0.0-amd64.tar.gz
            dist/fwlog-upgrade-v0.0.0.x86_64.rpm
            dist/fwlog-upgrade_0.0.0_amd64.deb
            dist/fwlog-upgrade-v0.0.1.x86_64.rpm
            dist/fwlog-upgrade_0.0.1_amd64.deb
          if-no-files-found: error
